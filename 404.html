<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lirix</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:760px;margin:0 auto;padding:24px 20px 80px;color:#0f172a;line-height:1.6}
h1{font-size:1.6rem;margin-bottom:4px}
p{margin-top:0;margin-bottom:20px;color:#1e293b}
a{color:#3b82f6}
nav{margin-bottom:32px;font-size:0.9rem}
nav a{margin-right:16px}
.btn{display:inline-block;background:#0a0f1c;color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:600;margin:4px 8px 4px 0}
</style>
</head>
<body>
<nav><a href="/">Lirix</a> · <a href="/legal/privacy/">Privacy</a> · <a href="/legal/terms/">Terms</a></nav>
<div id="app">
<h1>Lirix</h1>
<p>Page introuvable. / Page not found.</p>
<p><a href="/">Retour à l'accueil / Back home</a></p>
</div>
<script>
  // GitHub Pages serves this file for ANY unmatched path — including
  // /i/<code> and /invite/<code>, the app's invite links. When the app
  // isn't installed, iOS/Android fall through to the browser here instead
  // of opening it. Detect that case client-side and show an install CTA
  // instead of a bare 404 — tapping the same invite link again once the
  // app is installed lets the native Universal/App Link take over.
  var m = location.pathname.match(/^\/(?:i|invite)\/([A-Za-z0-9]{4,12})\/?$/);
  if (m) {
    document.getElementById('app').innerHTML =
      '<h1>Lirix</h1>' +
      '<p>Tu as été invité·e sur Lirix. Installe l\'app, puis retape ce lien pour rejoindre ton ami.</p>' +
      '<p><a class="btn" href="https://play.google.com/store/apps/details?id=app.lirix.client">▶ Google Play</a></p>' +
      '<p style="margin-top:48px">You were invited to Lirix. Install the app, then open this link again to join your friend.</p>' +
      '<p><a class="btn" href="https://play.google.com/store/apps/details?id=app.lirix.client">▶ Google Play</a></p>';
  }
</script>
</body>
</html>
